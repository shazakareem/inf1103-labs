<rect x="50" y="100" width="365" height="240" rx="3" fill="white" stroke="#334155" stroke-width="2"/><rect x="51" y="101" width="363" height="47" fill="#dbeafe"/><text x="232.5" y="131" text-anchor="middle" class="name">Inventory</text><path d="M50 148 H415" class="line"/><path d="M50 192 H415" class="line"/><text x="64" y="175" class="member">- products: list[Product]</text><text x="64" y="219" class="member">+ add_product(product)</text><text x="64" y="245" class="member">+ search_product(product_id)</text><text x="64" y="271" class="member">+ update_stock(product_id, quantity)</text><text x="64" y="297" class="member">+ display_all()</text><text x="64" y="323" class="member">+ get_products()</text><rect x="550" y="100" width="430" height="346" rx="3" fill="white" stroke="#334155" stroke-width="2"/><rect x="551" y="101" width="428" height="75" fill="#dbeafe"/><text x="765.0" y="125" text-anchor="middle" class="tag">&lt;&lt;abstract&gt;&gt;</text><text x="765.0" y="159" text-anchor="middle" class="name">Product</text><path d="M550 176 H980" class="line"/><path d="M550 298 H980" class="line"/><text x="564" y="203" class="member">- product_id: str</text><text x="564" y="229" class="member">- name: str</text><text x="564" y="255" class="member">- price: float</text><text x="564" y="281" class="member">- stock: int</text><text x="564" y="325" class="member">+ get_product_id()</text><text x="564" y="351" class="member">+ update_stock(quantity)</text><text x="564" y="377" class="member">+ display_information()</text><text x="564" y="403" class="member">+ to_dict()</text><text x="564" y="429" class="member" font-style="italic">+ get_fulfilment_info() {abstract}</text><rect x="50" y="670" width="375" height="214" rx="3" fill="white" stroke="#334155" stroke-width="2"/><rect x="51" y="671" width="373" height="47" fill="#dbeafe"/><text x="237.5" y="701" text-anchor="middle" class="name">PhysicalProduct</text><path d="M50 718 H425" class="line"/><path d="M50 762 H425" class="line"/><text x="64" y="745" class="member">- weight: float</text><text x="64" y="789" class="member">+ display_information()</text><text x="64" y="815" class="member">+ get_fulfilment_info()</text><text x="64" y="841" class="member">+ calculate_shipping_cost()</text><text x="64" y="867" class="member">+ to_dict()</text><rect x="550" y="670" width="375" height="188" rx="3" fill="white" stroke="#334155" stroke-width="2"/><rect x="551" y="671" width="373" height="47" fill="#dbeafe"/><text x="737.5" y="701" text-anchor="middle" class="name">DigitalProduct</text><path d="M550 718 H925" class="line"/><path d="M550 762 H925" class="line"/><text x="564" y="745" class="member">- download_size: float</text><text x="564" y="789" class="member">+ display_information()</text><text x="564" y="815" class="member">+ get_fulfilment_info()</text><text x="564" y="841" class="member">+ to_dict()</text><rect x="50" y="445" width="375" height="164" rx="3" fill="white" stroke="#334155" stroke-width="2"/><rect x="51" y="446" width="373" height="75" fill="#dbeafe"/><text x="237.5" y="470" text-anchor="middle" class="tag">&lt;&lt;interface&gt;&gt;</text><text x="237.5" y="504" text-anchor="middle" class="name">CanBeShipped</text><path d="M50 521 H425" class="line"/><path d="M50 565 H425" class="line"/><text x="64" y="592" class="member" font-style="italic">+ calculate_shipping_cost() {abstract}</text><path d="M415 222 L429 214 L443 222 L429 230 Z" fill="white" stroke="#334155" stroke-width="2"/>
